name: Prepare release pull request
on:
  push: 
    tags:
      - '**'
    branches: 
      - master
  workflow_dispatch:

permissions: {}
concurrency:
  group: ${{ github.workflow }}

jobs:
  prepare-release-pr:
    name: Prepare release pull request
    uses: equinor/radix-reusable-workflows/.github/workflows/template-prepare-release-pr.yml@1c276b3288a8749e369cd05b503e73bd7a3370c1 # v1.1.1
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      branch: master
      cliff-config-path: cliff.toml
      generate-pre-release-pr: false

name: Create releases and tags
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}
jobs:
  unreleased-prs-metadata:
    name: Get list of pending release pull requests
    permissions:
      pull-requests: read
      contents: read
    uses: equinor/radix-reusable-workflows/.github/workflows/template-unreleased-pr-metadata.yml@c09456726181391559941adde1a467846eb60975 # v1.2.0

  release-pull-request:
    name: Release pull request
    needs:
      - unreleased-prs-metadata
    if: needs.unreleased-prs-metadata.outputs.unreleased-pull-request-count > 0
    strategy:
      matrix:
        pull-request-number: ${{ fromJson(needs.unreleased-prs-metadata.outputs.unreleased-pull-requests) }}
    permissions:
      pull-requests: write
      contents: read
      issues: write
    uses: equinor/radix-reusable-workflows/.github/workflows/template-create-release-from-pr.yml@c09456726181391559941adde1a467846eb60975 # v1.2.0
    with:
      pull-request-number: ${{ matrix.pull-request-number }}
      use-github-app-token: true
      github-app-id: ${{ vars.GH_APP_ID }}
      set-draft: true
    secrets:
      github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  build:
    needs:
      - unreleased-prs-metadata
      - release-pull-request
    if: needs.unreleased-prs-metadata.outputs.unreleased-pull-request-count == 1

    runs-on: radix-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the Container registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - run: git tag ${{ matrix.release-pull-request.tag }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish matching draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"

          if [[ "$is_draft" != "true" ]]; then
            echo "Release $tag is already published."
            exit 0
          fi

          gh release edit "$tag" --draft=false
          echo "Published release $tag."
